<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FitNova - Progress Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📈 Progress Dashboard</h1>

<div class="card">

<h2>Health Summary</h2>

<p>
<strong>Name:</strong>
<span id="progressName"></span>
</p>

<p>
<strong>BMI:</strong>
<span id="progressBMI"></span>
</p>

<p>
<strong>BMI Status:</strong>
<span id="progressBMIStatus"></span>
</p>

<p>
<strong>Water Intake:</strong>
<span id="progressWater">0</span> / 8 Glasses
</p>

<p>
<strong>Total Calories:</strong>
<span id="progressCalories">0</span> kcal
</p>

<p>
<strong>Total Workout:</strong>
<span id="progressWorkout">0</span>
</p>

<p>
<strong>Current Weight:</strong>
<span id="progressWeight">0</span> kg
</p>

</div>

<div class="card">

<h2>🏆 Achievements</h2>

<ul>

<li>💧 Complete 7 days water streak</li>

<li>💪 Complete your first workout</li>

<li>🥗 Maintain healthy eating</li>

<li>🎯 Complete fitness goal</li>

</ul>

</div>

<div class="card">

<button onclick="location.href='dashboard.html'">
⬅ Dashboard
</button>

<button onclick="location.href='settings.html'">
⚙ Settings
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
